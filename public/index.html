<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片分镜</title>
    <meta name="application-name" content="卡片分镜">
    <meta name="theme-color" content="#f6f3eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171814" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="卡片分镜">
    <script src="/js/preload.js"></script>
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
    <script src="/vendor/sortable-lite.js" defer></script>
</head>

<body>
    <div id="auth-view" class="auth-view hidden">
        <section class="auth-card">
            <img class="brand-mark" src="/icons/logo-mark.svg" alt="" width="52" height="52">
            <h1 id="auth-title">登录卡片分镜</h1>
            <p id="auth-description">登录已有账户，继续整理你的分镜本。</p>
            <form id="login-form" class="stack-form">
                <label>用户名<input name="username" autocomplete="username" required></label>
                <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
                <button class="primary-btn" type="submit">登录</button>
                <p id="login-error" class="form-message" aria-live="polite"></p>
            </form>
            <form id="registration-form" class="stack-form hidden">
                <label>用户名<input name="username" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,31}" autocomplete="username" required></label>
                <p class="field-note">3–32 位，以英文或数字开头，可含点、下划线和连字符。</p>
                <label>显示名称<input name="displayName" maxlength="80" autocomplete="name" required></label>
                <label>密码<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
                <label>确认密码<input name="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
                <button class="primary-btn" type="submit">创建账户</button>
                <p id="registration-error" class="form-message" aria-live="polite"></p>
            </form>
            <p id="auth-switch" class="auth-switch hidden">
                <span>还没有账户？</span>
                <button id="show-registration-btn" type="button">创建账户</button>
                <button id="show-login-btn" class="hidden" type="button">返回登录</button>
            </p>
        </section>
    </div>
    <div id="home-view" class="home-view">
        <section class="home-main">
            <header class="home-header">
                <div class="home-header-left">
                    <img class="brand-mark" src="/icons/logo-mark.svg" alt="" width="42" height="42">
                    <div class="brand-heading">
                        <h1>卡片分镜</h1>
                        <span>我的分镜本</span>
                    </div>
                </div>
                <div class="home-toolbar-actions">
                    <div class="home-controls">
                        <label for="project-sort">排序</label>
                        <select id="project-sort">
                            <option value="updated_desc">修改日期</option>
                            <option value="name_asc">项目名称</option>
                            <option value="updated_asc">最早修改</option>
                        </select>
                    </div>
                    <input id="project-search" class="home-search" type="search" placeholder="搜索分镜本...">
                    <div class="account-actions">
                        <span id="account-name" class="account-name"></span>
                        <button id="account-btn" class="secondary-btn compact-btn" type="button">账户</button>
                        <button id="admin-accounts-btn" class="secondary-btn compact-btn hidden" type="button">管理</button>
                        <button id="logout-btn" class="secondary-btn compact-btn" type="button">退出</button>
                    </div>
                </div>
            </header>

            <main class="projects-grid" id="projects-grid">
                <!-- Project cards -->
            </main>

            <footer class="home-footer">
                <p>© <time id="copyright-year" datetime="2026">2026</time> Daqincha. All rights reserved.</p>
            </footer>
        </section>
    </div>

    <div id="editor-view" class="editor-view hidden">
        <div class="app-container">
            <!-- Header -->
            <header class="project-header">
                <span id="project-access-badge" class="access-badge hidden" aria-label="项目权限"></span>
                <span id="project-total-duration" class="project-total-duration" aria-live="polite">总时长 0s</span>
                <div class="header-group flex-1">
                    <span class="header-label">PROJECT 项目</span>
                    <input type="text" class="header-input" placeholder="输入项目名">
                </div>

                <div class="header-group flex-1">
                    <span class="header-label">SCENE 场景</span>
                    <input type="text" class="header-input" placeholder="输入场景描述">
                </div>

                <div class="header-actions">
                    <button id="back-to-home-btn" class="secondary-btn home-icon-btn" title="返回主页" aria-label="返回主页">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true">
                            <path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M5 10.5V20H19V10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M10 20V14H14V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>

                    <div class="header-group aspect-ratio-group">
                        <span class="header-label">画幅</span>
                        <select id="aspect-ratio-select" class="header-select">
                            <option value="16/9">16:9</option>
                            <option value="4/3">4:3</option>
                            <option value="2.35/1">2.35:1</option>
                        </select>
                    </div>

                    <button id="multi-select-toggle-btn" class="secondary-btn multi-select-toggle-btn" type="button" aria-pressed="false">
                        多选
                    </button>

                    <button id="manage-sharing-btn" class="secondary-btn hidden" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2" />
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        协作
                    </button>

                    <div class="add-btn-group">
                        <button id="add-shot-btn" class="primary-btn btn-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            添加分镜
                        </button>
                        <div class="dropdown">
                            <button class="primary-btn btn-right" id="add-dropdown-toggle">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </button>
                            <div class="dropdown-menu" id="add-dropdown-menu">
                                <button class="dropdown-item" data-add-count="5">添加 5 个分镜</button>
                                <button class="dropdown-item" data-add-count="10">添加 10 个分镜</button>
                            </div>
                        </div>
                    </div>

                    <div class="add-btn-group export-btn-group">
                        <button id="export-pdf-btn" class="secondary-btn btn-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-3 3m0 0l-3-3m3 3V4" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            导出 PDF
                        </button>
                        <div class="dropdown">
                            <button class="secondary-btn btn-right" id="export-dropdown-toggle" type="button"
                                title="更多导出选项" aria-label="更多导出选项" aria-haspopup="menu" aria-expanded="false">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </button>
                            <div class="dropdown-menu export-dropdown-menu" id="export-dropdown-menu" role="menu">
                                <button id="open-rundown-btn" class="dropdown-item" type="button" role="menuitem">拍摄 Rundown</button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div id="edit-lock-banner" class="edit-lock-banner hidden" role="status"></div>

            <!-- Storyboard Grid -->
            <main class="storyboard-grid" id="storyboard-grid">
                <!-- Shot Cards go here -->
            </main>
        </div>
    </div>

    <div id="rundown-view" class="rundown-view hidden">
        <header class="rundown-topbar">
            <div class="rundown-topbar-main">
                <button id="rundown-back-btn" class="secondary-btn rundown-back-btn" type="button" aria-label="返回分镜" title="返回分镜">←</button>
                <div>
                    <p class="rundown-kicker">拍摄计划</p>
                    <h1 id="rundown-project-title">Rundown</h1>
                </div>
            </div>
            <div class="rundown-topbar-actions">
                <span id="rundown-save-state" class="rundown-save-state" data-state="saved" role="status" aria-live="polite">已保存</span>
                <button id="rundown-add-day-btn" class="secondary-btn" type="button">添加拍摄日</button>
                <button id="rundown-export-btn" class="primary-btn" type="button">导出 Rundown PDF</button>
            </div>
        </header>

        <div id="rundown-readonly-banner" class="rundown-readonly-banner hidden">当前为只读模式，可查看和导出 Rundown。</div>

        <div class="rundown-workspace">
            <aside class="rundown-pool-panel">
                <div class="rundown-panel-heading">
                    <div>
                        <p class="rundown-kicker">未安排</p>
                        <h2>镜头池 <span id="rundown-unscheduled-count">0</span></h2>
                    </div>
                </div>
                <label class="rundown-filter-field">
                    <span>搜索</span>
                    <input id="rundown-search" type="search" placeholder="镜号、场次、动作…">
                </label>
                <div class="rundown-filter-grid">
                    <label class="rundown-filter-field">
                        <span>场次</span>
                        <select id="rundown-scene-filter"><option value="">全部场次</option></select>
                    </label>
                    <div class="rundown-filter-field">
                        <span id="rundown-color-filter-label">颜色</span>
                        <div class="rundown-color-filter">
                            <button id="rundown-color-filter" class="rundown-color-filter-trigger" type="button" value=""
                                aria-haspopup="listbox" aria-expanded="false" aria-controls="rundown-color-filter-menu"
                                aria-labelledby="rundown-color-filter-label rundown-color-filter-value">
                                <span id="rundown-color-filter-value" class="rundown-color-filter-selection">
                                    <span class="rundown-color-filter-dot is-all" aria-hidden="true"></span>
                                    <span>全部颜色</span>
                                </span>
                                <span class="rundown-color-filter-chevron" aria-hidden="true">⌄</span>
                            </button>
                            <div id="rundown-color-filter-menu" class="rundown-color-filter-menu" role="listbox"
                                aria-labelledby="rundown-color-filter-label" hidden></div>
                        </div>
                    </div>
                </div>
                <label class="rundown-filter-field">
                    <span>快速加入到</span>
                    <select id="rundown-target-day"><option value="">请先添加拍摄日</option></select>
                </label>
                <button id="rundown-add-filtered-btn" class="secondary-btn rundown-wide-btn" type="button">加入当前筛选结果</button>
                <div id="rundown-shot-pool" class="rundown-shot-pool"></div>
            </aside>

            <main class="rundown-schedule-panel">
                <div class="rundown-bulk-toolbar">
                    <span id="rundown-summary">尚未安排拍摄</span>
                </div>
                <div id="rundown-validation-summary" class="rundown-validation-summary hidden" role="status"></div>
                <div id="rundown-days" class="rundown-days"></div>
                <div id="rundown-empty" class="rundown-empty">
                    <h2>先添加一个拍摄日</h2>
                    <p>再从左侧把镜头拖入日程，或插入集合、布光、午餐等现场事项。</p>
                </div>
            </main>
        </div>
    </div>

    <div id="rundown-print-root" class="rundown-print-root" aria-hidden="true"></div>

    <template id="project-card-template">
        <article class="project-card">
            <div class="project-card-cover-wrap">
                <button class="project-card-cover" type="button">
                    <div class="project-card-cover-inner">
                    </div>
                </button>
                <button class="project-duplicate-btn" type="button" title="复制项目" aria-label="复制项目">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="9" y="9" width="11" height="11" rx="1.8" stroke="currentColor" stroke-width="1.8" />
                        <path d="M5 15V5.8C5 4.81 5.81 4 6.8 4H16" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="project-pin-btn" type="button" title="置顶项目" aria-label="置顶项目">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 3.5l2.58 5.22 5.76.84-4.17 4.06.99 5.74L12 16.66 6.84 19.36l.99-5.74L3.66 9.56l5.76-.84L12 3.5z"
                            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="project-delete-btn" type="button" title="删除项目" aria-label="删除项目">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 7h16M9 7V5h6v2M10 11v6M14 11v6M7 7l1 12h8l1-12" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
            <h3 class="project-card-title"></h3>
            <p class="project-card-updated"></p>
        </article>
    </template>

    <!-- Template for Shot Card -->
    <template id="shot-template">
        <article class="shot-card">
            <header class="shot-header">
                <div class="header-left-actions">
                    <div class="drag-handle" title="拖动排序">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 6h8M8 12h8M8 18h8M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="shot-number">
                        SHOT #<span class="shot-index">1</span>
                    </div>
                </div>

                <div class="header-center-actions">
                    <div class="shot-time-control">
                        <button type="button" class="shot-time-step shot-time-decrement" aria-label="时长减少 0.1 秒">−</button>
                        <div class="shot-time-value">
                            <span class="shot-time-input-sizer" data-value="时长">
                                <input type="text" class="shot-time-input" size="1" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" placeholder="时长" aria-label="镜头时长（秒）">
                            </span>
                            <span class="shot-time-unit" aria-hidden="true">s</span>
                        </div>
                        <button type="button" class="shot-time-step shot-time-increment" aria-label="时长增加 0.1 秒">+</button>
                    </div>
                </div>

                <div class="header-right-actions">
                    <div class="shot-vfx">
                        <label class="vfx-checkbox">
                            <input type="checkbox">
                            <span class="vfx-circle"></span>
                            VFX
                        </label>
                    </div>
                    <div class="color-picker-wrapper" title="更改场景颜色">
                        <button type="button" class="scene-color-trigger" aria-label="选择场景颜色"></button>
                        <div class="scene-color-palette"></div>
                    </div>
                    <button class="delete-shot-btn" title="删除分镜">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </header>

                <div class="shot-image-container">
                    <input type="file" class="image-upload" accept="image/*" hidden>
                    <div class="image-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15M17 8L12 3M12 3L7 8M12 3V15"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <span class="image-placeholder-hint">点击上传参考图<br>或使用键盘粘贴图片</span>
                    </div>
                    <img class="shot-image-preview" src="" alt="Shot Preview" style="display: none;">
                    <div class="image-hover-actions">
                        <button type="button" class="image-action-btn replace-image-btn">更换图片</button>
                        <button type="button" class="image-action-btn delete-image-btn">删除</button>
                    </div>
                </div>

            <div class="shot-camera-move">
                <label class="radio-label">
                    <input type="radio" value="Static固定" checked>
                    <span class="radio-custom"></span> 三角架
                </label>
                <label class="radio-label">
                    <input type="radio" value="HH手持">
                    <span class="radio-custom"></span> 手持
                </label>
                <label class="radio-label">
                    <input type="radio" value="Dolly轨道">
                    <span class="radio-custom"></span> 轨道
                </label>
                <label class="radio-label">
                    <input type="radio" value="Gimbal稳定器">
                    <span class="radio-custom"></span> 稳定器
                </label>
            </div>

            <div class="shot-details">
                <div class="shot-select-row" role="group" aria-label="景别和运镜">
                    <label class="shot-select-field">
                        <select class="shot-detail-select shot-size-select" aria-label="景别" required>
                            <option value="" selected disabled hidden>景别</option>
                            <option value="大特写">大特写</option>
                            <option value="特写">特写</option>
                            <option value="近景">近景</option>
                            <option value="中景">中景</option>
                            <option value="全景">全景</option>
                            <option value="远景">远景</option>
                        </select>
                    </label>
                    <span class="shot-select-divider" aria-hidden="true"></span>
                    <label class="shot-select-field">
                        <select class="shot-detail-select camera-movement-select" aria-label="运镜" required>
                            <option value="" selected disabled hidden>运镜</option>
                            <option value="固定">固定</option>
                            <option value="推进">推进</option>
                            <option value="拉远">拉远</option>
                            <option value="摇">摇</option>
                            <option value="移">移</option>
                            <option value="前进跟">前进跟</option>
                            <option value="后退跟">后退跟</option>
                            <option value="环绕">环绕</option>
                            <option value="长镜头">长镜头</option>
                        </select>
                    </label>
                </div>
                <div class="divider"></div>
                <div class="auto-resize-textarea rich-text-input text-action" contenteditable="true" role="textbox"
                    aria-multiline="true" data-placeholder="输入镜头内容描述"></div>
                <div class="divider"></div>
                <div class="auto-resize-textarea rich-text-input text-dialogue" contenteditable="true" role="textbox"
                    aria-multiline="true" data-placeholder="备注"></div>
            </div>
        </article>
    </template>

    <script type="module" src="/script.js"></script>
</body>

</html>
