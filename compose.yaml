services:
  card-storyboard:
    image: node:22-bookworm-slim
    container_name: card-storyboard
    restart: unless-stopped

    working_dir: /app
    command:
      - node
      - server.js

    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "5199"
      STORYBOARD_DATA_FILE: /app/data/storyboard.db
      STORYBOARD_PUBLIC_ORIGIN: ${STORYBOARD_PUBLIC_ORIGIN:-http://localhost:5199}
      STORYBOARD_ALLOWED_ORIGINS: ${STORYBOARD_ALLOWED_ORIGINS:-http://localhost:5199}
      STORYBOARD_ALLOW_INSECURE_HTTP: ${STORYBOARD_ALLOW_INSECURE_HTTP:-1}
      STORYBOARD_ALLOW_REGISTRATION: ${STORYBOARD_ALLOW_REGISTRATION:-1}

    ports:
      - "5199:5199"

    volumes:
      - ./:/app:ro
      - ./data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5199/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
