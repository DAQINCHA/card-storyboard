services:
  card-storyboard:
    image: node:22-bookworm-slim
    container_name: card-storyboard
    restart: unless-stopped

    working_dir: /app
    command:
      - node
      - server.js

    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "5188"
      STORYBOARD_DATA_FILE: /app/data/storyboard.db

    ports:
      - "5188:5188"

    volumes:
      - ./:/app:ro
      - ./data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5188/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
